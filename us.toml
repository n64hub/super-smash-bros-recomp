# N64Recomp's configuration for Super Smash Bros. (USA), SHA-1 e2929e10fccc0aa84e5776227e798abc07cedabf: it reads the
# game's code out of the ROM by the symbols in syms/ and writes RecompiledFuncs/ (tools/recompile.sh). The code is
# stored raw in the ROM (only the game's data files are VPK0-compressed), so there is nothing to decompress first.
[input]
# The decomp's entrypoint (src/entry.s), which the ROM's header gives too.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/smashbrothers.us.syms.toml"
rom_file_path = "roms/smashbrothers.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

# The game's anti-piracy checks (the decomp's lbdef.h, LBBACKUP_ERROR_*), each answered as a console with the cartridge
# answers it, so none of their penalties (random knockback, half the stick's range, Mario only in the 1P game,
# Peach's Castle only in VS) is ever saved. Two read the RSP's memory at boot (sys/main.c), which the runtime doesn't
# map: IMEM's first word is the CIC's 6103 and DMEM's -1. Two run code they load from a data file (sc1pgame.c past the
# 92nd boot, scvsbattle.c past the 68th), which is in no overlay, so a recompilation can't run it: the call returns
# TRUE, what it returns for the cartridge.
[[patches.instruction]]
func = "syMainSetImemStatus"
vram = 0x80000484
value = 0x240F17D7 # lw t7, 0x1000(t6) -> addiu t7, zero, 6103

[[patches.instruction]]
func = "syMainSetDmemStatus"
vram = 0x800004B4
value = 0x240FFFFF # lw t7, 0(t6) -> addiu t7, zero, -1

[[patches.instruction]]
func = "scVSBattleStartBattle"
vram = 0x8018D2E0
value = 0x24020001 # jalr s0 (llSYKseg1ValidateFunc) -> addiu v0, zero, 1

[[patches.instruction]]
func = "sc1PGameFuncStart"
vram = 0x8018F870
value = 0x24020001 # jalr s0 (llSYSignValidateFunc) -> addiu v0, zero, 1

# The audio thread reads the AI's length register straight from the hardware (sys/audio.c's IO_READ(AI_LEN_REG), to
# pick the next buffer's size), and the runtime maps no hardware registers: each read is a nop, and the register it
# loads gets osAiGetLength's answer, the same register's value.
[[patches.instruction]]
func = "syAudioThreadMain"
vram = 0x800202E4
value = 0x00000000 # lw t5, 4(t4) -> nop

[[patches.hook]]
func = "syAudioThreadMain"
before_vram = 0x800202E8
text = "{ void osAiGetLength_recomp(uint8_t*, recomp_context*); gpr v0 = ctx->r2; osAiGetLength_recomp(rdram, ctx); ctx->r13 = ctx->r2; ctx->r2 = v0; }"

[[patches.instruction]]
func = "syAudioThreadMain"
vram = 0x800209AC
value = 0x00000000 # lw t4, 4(t8) -> nop

[[patches.hook]]
func = "syAudioThreadMain"
before_vram = 0x800209B0
text = "{ void osAiGetLength_recomp(uint8_t*, recomp_context*); gpr v0 = ctx->r2; osAiGetLength_recomp(rdram, ctx); ctx->r12 = ctx->r2; ctx->r2 = v0; }"

# The game waits for its other threads in loops that only read a variable those threads set (the decomp's
# sc/scmanager.c waits on the audio thread at boot, the opening movie and title on the scheduler's tic count, the 1P
# game and VS battles for the music to stop). A console's interrupts preempt such a loop, but the runtime runs one
# game thread at a time and switches only when the running one calls into it, so the loop would spin forever: each
# getter those loops call lets the other threads run when it is called again within 100 us, which only a loop does
# (src/game/recomp_api.cpp).
[[patches.hook]]
func = "sySchedulerGetTicCount"
before_vram = 0x8000092C
text = "{ void ssb_spin_yield(uint8_t*, int); ssb_spin_yield(rdram, 0); }"

[[patches.hook]]
func = "syAudioCheckBGMPlaying"
before_vram = 0x80020D58
text = "{ void ssb_spin_yield(uint8_t*, int); ssb_spin_yield(rdram, 1); }"

[[patches.hook]]
func = "syAudioGetSettingsUpdated"
before_vram = 0x8002103C
text = "{ void ssb_spin_yield(uint8_t*, int); ssb_spin_yield(rdram, 2); }"

[[patches.hook]]
func = "syAudioGetRestarting"
before_vram = 0x80021048
text = "{ void ssb_spin_yield(uint8_t*, int); ssb_spin_yield(rdram, 3); }"

# Overlays: the runtime registers the code inside ROM 0x1000 plus 1 MB at startup, and any other code only when it is
# told it was loaded. Every overlay the game loads comes through syDmaLoadOverlay (the decomp's src/sys/dma.c), which
# takes an SYOverlay (its ROM start and end, then where it loads): each scene's code as the scene manager starts it
# (src/sc/scmanager.c), and the code the scenes share at boot. A hook at its start registers what it is about to copy
# (src/game/recomp_api.cpp).
[[patches.hook]]
func = "syDmaLoadOverlay"
before_vram = 0x80002BE4
text = "{ void ssb_load_overlay(uint8_t*, gpr); ssb_load_overlay(rdram, ctx->r4); }"
