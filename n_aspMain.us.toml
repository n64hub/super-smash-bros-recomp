# RSPRecomp's configuration for Super Smash Bros. (USA)'s audio microcode, n_aspMain. Graphics tasks go to RT64; the
# audio tasks the game sends need this microcode recompiled to run (src/main/main.cpp, get_rsp_microcode).
# tools/recompile.sh writes it into RecompiledFuncs/.
#
# - The text is the decomp's rsp/n_aspmain textbin (smashbrothers.us.yaml), ROM 0x3A2C0, 0xC60 bytes up to the
#   graphics microcode's at 0x3AF20.
# - text_address is the IMEM address its first byte runs at, 0x04001080, after the boot microcode, as every n_aspMain
#   has it.
# - The command handlers are reached through a table in the data segment (rsp/n_aspmain's databin, ROM 0x40000), which
#   RSPRecomp can't find by following the instructions, so they are listed below: the data's first 16 halfwords, the
#   two that are 0 left out and 0x02B0 as the IMEM address 0x12B0 a jump to it reaches.

rom_file_path = "roms/smashbrothers.us.z64"
text_offset = 0x3A2C0
text_size = 0xC60
text_address = 0x04001080

# C++, not C: the output includes librecomp's RSP header. CMakeLists.txt builds RecompiledFuncs/*.cpp with the game.
output_file_path = "RecompiledFuncs/n_aspMain_rsp.cpp"
output_function_name = "n_aspMain_run"

extra_indirect_branch_targets = [
    0x10EC, 0x139C, 0x119C, 0x1A64, 0x11C8, 0x17EC, 0x1208, 0x127C,
    0x1348, 0x1248, 0x1C84, 0x12D4, 0x12B0, 0x1384,
]
